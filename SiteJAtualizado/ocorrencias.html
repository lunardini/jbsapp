<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocorrências · Controle de Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div id="carregando" class="carregando"><span class="carregando__pulso"></span>Verificando sessão…</div>

<div class="casca" id="casca" hidden>
  <aside class="lateral" id="lateral"></aside>

  <div class="corpo">
    <header class="topo-movel">
      <button id="abrir-menu" class="botao botao--icone" type="button" aria-label="Abrir menu">☰</button>
      <span class="topo-movel__titulo">Ocorrências</span>
    </header>

    <main class="pagina">
      <div class="pagina__cabeca">
        <div>
          <p class="olho">Painel</p>
          <h1 class="pagina__titulo">Ocorrências registradas</h1>
          <p class="pagina__apoio">Período <strong id="legenda-periodo" class="mono">—</strong>. Clique em uma linha para ver os itens devolvidos.</p>
        </div>
        <button id="btn-exportar" class="botao botao--principal" type="button" disabled>Exportar Excel</button>
      </div>

      <div id="indicadores" class="indicadores"></div>

      <section class="cartao secao">
        <div class="cartao__cabeca">
          <h3>Filtros</h3>
          <div class="atalhos">
            <button class="botao botao--miudo" type="button" data-periodo="0">Hoje</button>
            <button class="botao botao--miudo" type="button" data-periodo="7">7 dias</button>
            <button class="botao botao--miudo" type="button" data-periodo="30">30 dias</button>
            <button class="botao botao--miudo" type="button" data-periodo="90">90 dias</button>
          </div>
        </div>
        <div class="filtros">
          <div>
            <label class="rotulo" for="filtro-inicio">De</label>
            <input id="filtro-inicio" class="entrada" type="date">
          </div>
          <div>
            <label class="rotulo" for="filtro-fim">Até</label>
            <input id="filtro-fim" class="entrada" type="date">
          </div>
          <div>
            <label class="rotulo" for="filtro-motivo">Motivo</label>
            <select id="filtro-motivo" class="entrada"></select>
          </div>
          <div>
            <label class="rotulo" for="filtro-usuario">Usuário</label>
            <select id="filtro-usuario" class="entrada"><option value="">Todos os usuários</option></select>
          </div>
          <div>
            <label class="rotulo" for="filtro-texto">NF, placa, cliente</label>
            <input id="filtro-texto" class="entrada" type="search" placeholder="Filtrar na tela">
          </div>
          <div class="filtros__acoes">
            <button id="btn-atualizar" class="botao botao--principal" type="button">Atualizar</button>
            <button id="btn-limpar" class="botao" type="button">Limpar</button>
          </div>
        </div>
      </section>

      <section class="secao duas-colunas">
        <div class="cartao">
          <div class="cartao__cabeca"><h3>Por motivo</h3></div>
          <div class="cartao__corpo" id="por-motivo"></div>
        </div>
        <div class="cartao">
          <div class="cartao__cabeca"><h3>Por usuário</h3></div>
          <div class="cartao__corpo" id="por-usuario"></div>
        </div>
      </section>

      <section class="secao">
        <div class="secao__titulo">
          <h2>Registros</h2>
          <small id="contador">—</small>
        </div>
        <div class="rolagem">
          <table id="tabela-oco" class="tabela">
            <thead>
              <tr>
                <th>NF</th><th>Placa</th><th>Motivo</th><th>Cliente</th><th>Vendedor</th>
                <th class="num">Itens</th><th class="num">Vl. devolvido</th><th class="num">Peso</th><th>Registrado por</th>
              </tr>
            </thead>
            <tbody><tr><td colspan="9" class="vazio">Carregando…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="avisos" class="avisos" aria-live="polite"></div>

<script type="module">
  import { iniciarPagina } from "./layout.js";
  import { iniciarDashboard } from "./dashboard.js";
  iniciarPagina("ocorrencias", iniciarDashboard);
</script>
</body>
</html>
